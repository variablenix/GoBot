name: GoBot CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gobot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Keep CI on the patched standard library release reported by govulncheck.
          go-version: '1.25.12'
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/irc-bot ./cmd/irc-bot

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
