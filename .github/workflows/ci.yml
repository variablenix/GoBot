name: GoBot CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  schedule:
    # Weekly UTC build, test, and vulnerability scan. Dependency update PRs
    # are handled separately by Dependabot.
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: gobot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # CI does not push or modify the repository.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Keep CI on the patched standard library release reported by govulncheck.
          go-version: '1.26.9'
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Locate Chrome for offline browser regressions
        shell: bash
        run: |
          test_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$test_browser" ]]; then
            echo "Chrome or Chromium is required for the offline Ask regression tests." >&2
            exit 1
          fi
          printf 'GOBOT_TEST_BROWSER=%s\n' "$test_browser" >> "$GITHUB_ENV"

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/irc-bot ./cmd/irc-bot

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
