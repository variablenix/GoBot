# GoBot configuration. Add one entry under networks for each IRC network.
# Each network can join any number of channels.
networks:
  - name: primary
    server:
      host: irc.example.net
      port: 6697
      tls: true
      verify_cert: true
    identity:
      nick: GoBot
      user: gobot
      realname: Go IRC Bot
      # After registering this nick with NickServ, set sasl_user/password.
      sasl_user: ""
      sasl_pass: ""
      # If SASL does not stick on a network, optionally fall back to NickServ.
      nickserv_fallback: false
      # If the network renames the bot to Guest..., try to reclaim the nick.
      nickserv_ghost: false
    channels:
      - "#example"
    # Optional per-channel opt-outs. Unlisted plugins keep the global setting.
    # plugin_overrides:
    #   "#quiet-channel":
    #     banter: false
    #     urltitle: false
    #     duckhunt: false

# For older single-network deployments, server/identity/channels can still be
# used instead of networks. Networks takes precedence when it is non-empty.
command_prefix: "!"
# Authenticated IRC account names reserved for future owner-only features.
# Nicknames alone are never treated as ownership proof.
owner_accounts:
  - "your-account"
# Anyone may invite the bot to a valid channel. Invited channels are not
# persisted; add permanent channels under the network's channels list.
invites:
  enabled: true
  cooldown_seconds: 30
# Outbound messages are rate limited per bot instance/network.
rate_limit:
  messages_per_second: 1.5
  burst: 5
  # Limit commands per authenticated account or sender identity.
  command_cooldown_seconds: 2
  # Limit cooldown warnings so they cannot become a second flood source.
  command_warning_cooldown_seconds: 10
  # Ignore channel backlog/history immediately after joining.
  join_warmup_seconds: 30
# Set enabled: false to disable any plugin.
plugins:
  correction: {enabled: true, history_size: 100}
  # Disabled by default to avoid unsolicited channel chatter.
  # quotes_file is optional; any plain text files in quotes/ are also loaded.
  # Set fortune_dir to an explicit, curated fortune directory if desired.
  # Leave empty to avoid loading the entire system fortune collection.
  banter: {enabled: true, probability: 0.54, quotes_file: "quotes/banter.txt", fortune_dir: ""}
  # Optional playful join greetings. The cooldown is per channel; placeholders
  # such as {nick} are replaced with the joining nickname.
  welcome: {enabled: false, probability: 0.15, cooldown_seconds: 120, messages_file: "data/welcome.txt"}
  # Optional YouTube Data API v3 key for reliable title/channel/duration data.
  # Without it, GoBot uses YouTube's public oEmbed/player fallbacks.
  urltitle: {enabled: true, max_title_length: 120, timeout_seconds: 5, youtube_api_key: ""}
  youtube: {enabled: true, max_length: 320, timeout_seconds: 10, api_key: ""}
  cve: {enabled: true, timeout_seconds: 8, max_length: 360}
  # Keyless IP-API lookups. The free endpoint is rate limited and uses HTTP.
  ipinfo: {enabled: true, timeout_seconds: 8, max_length: 320}
  # Local operator-maintained ACRONYM|expansion entries.
  acronym: {enabled: true, data_file: "data/acronyms.txt", max_length: 320}
  weather: {enabled: true, default_units: imperial}
  steam: {enabled: true, timeout_seconds: 10, max_length: 360}
  news: {enabled: true, api_key: "", max_results: 3}
  # Source-grounded answers stay keyless by default. AI rewriting is opt-in.
  # Use BOT_OPENROUTER_API_KEY, BOT_OPENAI_API_KEY, or BOT_GEMINI_API_KEY
  # instead of putting provider secrets in this file.
  ask:
    enabled: true
    wikipedia_first: true
    duckduckgo_fallback: true
    ai_rewrite: false
    provider: none # none, openrouter, openai, gemini, ollama
    max_length: 360
    max_response_chars: 240
    timeout_seconds: 12
    cooldown_seconds: 15
    openrouter_model: google/gemma-4-31b-it:free
    openai_model: gpt-4o-mini
    gemini_model: gemini-2.0-flash
    ollama_model: llama3.2
    ollama_url: http://127.0.0.1:11434
  wikipedia: {enabled: true, max_summary_length: 300}
  # Longer paragraphs remain one IRC message; truncated replies include a readable source link.
  horoscope: {enabled: true, max_summary_length: 360}
  urban: {enabled: true}
  xkcd: {enabled: true}
  # Requires a free Last.fm API key; leave empty to disable lookups.
  lastfm: {enabled: true, api_key: ""}
  cats: {enabled: true}
  eightball: {enabled: true, responses_file: "quotes/eightball.txt"}
  cheer: {enabled: true, cheers_file: "quotes/cheers.txt", automatic_cooldown_seconds: 15}
  seen: {enabled: true}
  tell: {enabled: true}
  note: {enabled: true, max_notes: 50, max_note_length: 400, expiry_days: 180}
  karma: {enabled: true}
  dice: {enabled: true}
  blackjack: {enabled: true}
  # Optional turn-based 8-ball and 9-ball games; no wagers or virtual currency.
  # 65% is a balanced casual default; use 100% for deterministic testing.
  pool: {enabled: true, game_timeout_minutes: 30, turn_timeout_seconds: 120, shot_success_percent: 65}
  poll: {enabled: true}
  remind: {enabled: true}
  quote: {enabled: true, quotes_file: "", fortune_dir: ""}
  choose: {enabled: true}
  time: {enabled: true}
  channelstats: {enabled: true}
  # One persistent claim per user per UTC day; XP is added to Duck Hunt progression.
  daily: {enabled: true, bonus_xp: 25}
  scramble: {enabled: true, data_file: "data/scramble.txt", timeout_minutes: 5, max_length: 240}
  status: {enabled: true}
  define: {enabled: true, timeout_seconds: 8, max_length: 240}
  calc: {enabled: true}
  # Local, operator-editable text catalogs; one line per entry under data/fun.
  fun: {enabled: true, data_dir: "data/fun", max_length: 240}
  attack: {enabled: true}
  # High-level local firearm/weapons catalog; identification only, no instructions.
  weapons: {enabled: true, data_file: "data/weapons.txt", max_length: 240}
  # Public GitHub lookups; token is optional and should be supplied out-of-band.
  github: {enabled: true, timeout_seconds: 8, max_length: 360, token: ""}
  reddit: {enabled: true, timeout_seconds: 8, max_length: 360}
  # Save and search memorable channel lines; only explicit grabs are persisted.
  grab: {enabled: true, max_length: 320, max_quotes_per_user: 20}
  # Read-only current kernel release lookup from kernel.org.
  linux: {enabled: true, timeout_seconds: 8, max_length: 260}
  # Local food and drink suggestions; add one item per line under data/foods.
  foods: {enabled: true, data_dir: "data/foods", max_length: 240}
  # Local sports suggestions; add one sport per line to data/sports.txt.
  sports: {enabled: true, data_file: "data/sports.txt", max_length: 200}
  car: {enabled: true, data_file: "data/cars.txt", max_length: 240}
  # Optional activity-triggered duck hunt. Scores and arcade gear persist in BoltDB.
  # Start/stop controls require an authenticated account listed in owner_accounts.
  duckhunt:
    enabled: false
    minimum_messages: 25
    minimum_users: 2
    min_delay_seconds: 60
    max_delay_seconds: 300
    timeout_seconds: 60
    flavor_enabled: true
    flavor_min_lead_seconds: 15
    befriend_enabled: true
    min_reaction_seconds: 1
    retry_cooldown_seconds: 7
    # Points are local to the bot; there is no wagering or external payment.
    minimum_hp: 1
    maximum_hp: 5
    damage_per_shot: 1
    befriend_attempts: 3
    golden_duck_probability: 0.15
    firearm_enabled: true
    magazine_size: 6
    starting_ammo: 6
    starting_points: 25
    magazine_cost: 15
    gun_cost: 25
    # Points are shop currency; XP is separate and controls player levels.
    xp_per_hit: 5
    xp_per_kill: 25
    xp_per_befriend: 10
stats:
  enabled: true
  http_port: 8082
  # Local default. Docker Compose overrides the address to 0.0.0.0 in the container.
  listen_address: 127.0.0.1
storage:
  db_path: bot.db
log:
  level: info
  format: console
