services:
  gobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: gobot:local
    container_name: gobot
    restart: unless-stopped
    environment:
      BOT_SASL_USER: ${BOT_SASL_USER:-}
      BOT_SASL_PASS: ${BOT_SASL_PASS:-}
      BOT_NEWS_API_KEY: ${BOT_NEWS_API_KEY:-}
      BOT_YOUTUBE_API_KEY: ${BOT_YOUTUBE_API_KEY:-}
      BOT_LASTFM_API_KEY: ${BOT_LASTFM_API_KEY:-}
      BOT_GITHUB_TOKEN: ${BOT_GITHUB_TOKEN:-}
      BOT_ASK_PROVIDER: ${BOT_ASK_PROVIDER:-none}
      BOT_ASK_AI_REWRITE: ${BOT_ASK_AI_REWRITE:-false}
      BOT_OPENROUTER_API_KEY: ${BOT_OPENROUTER_API_KEY:-}
      BOT_OPENROUTER_MODEL: ${BOT_OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      BOT_OPENAI_API_KEY: ${BOT_OPENAI_API_KEY:-}
      BOT_OPENAI_MODEL: ${BOT_OPENAI_MODEL:-gpt-4o-mini}
      BOT_GEMINI_API_KEY: ${BOT_GEMINI_API_KEY:-}
      BOT_GEMINI_MODEL: ${BOT_GEMINI_MODEL:-gemini-2.0-flash}
      BOT_OLLAMA_URL: ${BOT_OLLAMA_URL:-http://127.0.0.1:11434}
      BOT_OLLAMA_MODEL: ${BOT_OLLAMA_MODEL:-llama3.2}
      BOT_STORAGE_DB_PATH: /data/bot.db
      BOT_STATS_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      # Keep configuration editable without rebuilding the image.
      - ./config.yaml:/app/config.yaml:ro
      - gobot-data:/data
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8082/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gobot-data:
