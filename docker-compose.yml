services:
  gobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: gobot:local
    container_name: gobot
    restart: unless-stopped
    environment:
      BOT_SASL_USER: ${BOT_SASL_USER:-}
      BOT_SASL_PASS: ${BOT_SASL_PASS:-}
      BOT_NEWS_API_KEY: ${BOT_NEWS_API_KEY:-}
      BOT_STORAGE_DB_PATH: /data/bot.db
      BOT_STATS_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      # Keep configuration editable without rebuilding the image.
      - ./config.yaml:/app/config.yaml:ro
      - gobot-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gobot-data:
